name: Gentle Graph CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/graph-ci
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify automatic TypeScript test discovery
        shell: bash
        run: |
          set -eu -o pipefail
          smoke=tests/_smoke-discovery.test.ts
          test ! -e "$smoke"
          trap 'rm -f "$smoke"' EXIT
          export DISCOVERY_MARKER="$RUNNER_TEMP/discovery-marker"
          echo 'import { test } from "node:test"; import { appendFileSync } from "node:fs"; test("temporary discovery smoke", () => appendFileSync(process.env.DISCOVERY_MARKER!, "1"));' > "$smoke"
          pnpm test
          test "$(cat "$DISCOVERY_MARKER")" = 1
      - run: node --test tests/bench-abc.test.mjs
  jit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/graph-ci
      - run: node scripts/bench-jit.mjs 30000 --check
  queries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/graph-ci
      - uses: actions/checkout@v4
        with:
          repository: Gentleman-Programming/gentle-shell
          ref: c9b59eab57a56224c76b99e1caa9bb94cb113dc8
          path: benchmark-host
      - id: query
        run: node scripts/bench-queries.mjs benchmark-host
        env:
          GENTLE_GRAPH_PROFILE: "1"
      - name: Profile cold guide on the pinned host
        if: always() && github.event.pull_request.number == 6 && runner.os == 'Windows' && steps.query.outcome != 'skipped'
        run: node scripts/profile-cold-guide.mjs benchmark-host fab8f6ed17e942af049e224f262de52923c70533 662c3890282d45bb3c58c4616882189cfd374c45 HEAD
